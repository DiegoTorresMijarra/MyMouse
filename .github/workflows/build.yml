name: build

# Releases: al hacer push a una rama, si existe docs/releases/<tag>.md y aún no hay release con ese
# nombre, se compila y se publica la release <tag> apuntando a ese commit (GitHub crea la etiqueta).
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=""
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            for f in $(ls docs/releases/v*.md 2>/dev/null | sort -V); do
              t=$(basename "$f" .md)
              gh release view "$t" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || tag="$t"
            done
          fi
          if [[ -n "$tag" ]]; then version="${tag#v}"; else version="0.0-dev.${GITHUB_RUN_NUMBER}"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release: ${tag:-ninguna} · versión $version"

  android:
    needs: meta
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Versión
        run: |
          echo "MYMOUSE_VERSION_NAME=${{ needs.meta.outputs.version }}" >> "$GITHUB_ENV"
          echo "MYMOUSE_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - name: Tests y APK
        run: ./gradlew --no-daemon :core:test :app:assembleDebug
      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/MyMouse-${MYMOUSE_VERSION_NAME}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: MyMouse-*.apk

  windows:
    needs: meta
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Tests
        run: dotnet test
      - name: Publicar
        run: |
          $name = "${{ needs.meta.outputs.version }}"
          $common = @('-c','Release','-r','win-x64','--self-contained','true','-p:PublishSingleFile=true','-p:IncludeNativeLibrariesForSelfExtract=true',"-p:Version=$name","-p:InformationalVersion=$name")
          dotnet publish src/MyMouse.Host @common -o out/MyMouse
          dotnet publish src/MyMouse.TestClient @common -o out/MyMouse
          Get-ChildItem out/MyMouse -Filter *.pdb | Remove-Item
          Compress-Archive -Path out/MyMouse/* -DestinationPath "$env:GITHUB_WORKSPACE/MyMouse-Windows-$name.zip"
      # adb para el instalador: solo adb.exe, AdbWinApi.dll, AdbWinUsbApi.dll y la licencia (NOTICE.txt) de las platform-tools de Google.
      - name: Descargar adb
        run: |
          $zip = Join-Path $PWD 'out/platform-tools.zip'
          $url = 'https://dl.google.com/android/repository/platform-tools-latest-windows.zip'
          for ($i = 1; $i -le 3; $i++) {
            try { Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing; break }
            catch { if ($i -eq 3) { throw }; Write-Host "Descarga fallida ($i): $($_.Exception.Message)"; Start-Sleep -Seconds (5 * $i) }
          }
          Expand-Archive -Path $zip -DestinationPath out/platform-tools -Force
          New-Item -ItemType Directory -Force -Path out/adb | Out-Null
          foreach ($f in 'adb.exe', 'AdbWinApi.dll', 'AdbWinUsbApi.dll', 'NOTICE.txt') {
            $src = Join-Path out/platform-tools/platform-tools $f
            if (-not (Test-Path $src)) { throw "Falta $f en las platform-tools" }
            Copy-Item $src out/adb
          }
          Get-ChildItem out/adb | Format-Table Name, Length
      # Inno Setup: si el runner no trae ISCC.exe, se instala con Chocolatey. Se busca en las rutas habituales porque el PATH de
      # esta sesión no se actualiza tras instalarlo.
      - name: Inno Setup
        run: |
          function Find-Iscc {
            $cmd = Get-Command iscc -ErrorAction SilentlyContinue
            if ($cmd) { return $cmd.Source }
            $roots = @(${env:ProgramFiles(x86)}, $env:ProgramFiles, "$env:LOCALAPPDATA\Programs") | Where-Object { $_ }
            foreach ($r in $roots) {
              $p = Join-Path $r 'Inno Setup 6\ISCC.exe'
              if (Test-Path $p) { return $p }
            }
            return $null
          }
          $iscc = Find-Iscc
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "choco install innosetup falló ($LASTEXITCODE)" }
            $iscc = Find-Iscc
          }
          if (-not $iscc) { throw 'No se encuentra ISCC.exe tras instalar Inno Setup' }
          Write-Host "ISCC: $iscc"
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      # Los parámetros van por variables de entorno (las lee MyMouse.iss con GetEnv): valores con puntos, guiones o barras no necesitan comillas.
      - name: Instalador
        run: |
          $name = "${{ needs.meta.outputs.version }}"
          $env:MYMOUSE_VERSION = $name
          $env:MYMOUSE_SOURCE_DIR = (Resolve-Path out/MyMouse).Path
          $env:MYMOUSE_ADB_DIR = (Resolve-Path out/adb).Path
          $env:MYMOUSE_OUTPUT_DIR = $env:GITHUB_WORKSPACE
          & $env:ISCC installer/MyMouse.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC falló ($LASTEXITCODE)" }
          $setup = Join-Path $env:GITHUB_WORKSPACE "MyMouse-Setup-$name.exe"
          if (-not (Test-Path $setup)) { throw "No se generó $setup" }
          Get-Item $setup | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            MyMouse-Windows-*.zip
            MyMouse-Setup-*.exe

  release:
    if: needs.meta.outputs.tag != ''
    needs: [meta, android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Crear release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --prerelease --title "$TAG" --notes-file "docs/releases/$TAG.md"
