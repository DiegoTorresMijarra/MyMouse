name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Versión
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "MYMOUSE_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "MYMOUSE_VERSION_NAME=0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi
          echo "MYMOUSE_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - name: Tests y APK
        run: ./gradlew --no-daemon :core:test :app:assembleDebug
      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/MyMouse-${MYMOUSE_VERSION_NAME}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: MyMouse-*.apk

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Tests
        run: dotnet test
      - name: Publicar
        run: |
          $name = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.Substring(1) } else { "0.0-dev.$env:GITHUB_RUN_NUMBER" }
          $common = @('-c','Release','-r','win-x64','--self-contained','true','-p:PublishSingleFile=true','-p:IncludeNativeLibrariesForSelfExtract=true',"-p:InformationalVersion=$name")
          dotnet publish src/MyMouse.Host @common -o out/MyMouse
          dotnet publish src/MyMouse.TestClient @common -o out/MyMouse
          Get-ChildItem out/MyMouse -Filter *.pdb | Remove-Item
          Compress-Archive -Path out/MyMouse/* -DestinationPath "$env:GITHUB_WORKSPACE/MyMouse-Windows-$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: MyMouse-Windows-*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Crear release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          [ -f "$notes" ] || notes=/dev/null
          gh release create "$GITHUB_REF_NAME" dist/* --prerelease --title "$GITHUB_REF_NAME" --notes-file "$notes"
