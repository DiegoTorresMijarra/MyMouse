name: build

# Releases: al hacer push a una rama, si existe docs/releases/<tag>.md y aún no hay release con ese
# nombre, se compila y se publica la release <tag> apuntando a ese commit (GitHub crea la etiqueta).
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=""
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            for f in $(ls docs/releases/v*.md 2>/dev/null | sort -V); do
              t=$(basename "$f" .md)
              gh release view "$t" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || tag="$t"
            done
          fi
          if [[ -n "$tag" ]]; then version="${tag#v}"; else version="0.0-dev.${GITHUB_RUN_NUMBER}"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release: ${tag:-ninguna} · versión $version"

  android:
    needs: meta
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Versión
        run: |
          echo "MYMOUSE_VERSION_NAME=${{ needs.meta.outputs.version }}" >> "$GITHUB_ENV"
          echo "MYMOUSE_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - name: Tests y APK
        run: ./gradlew --no-daemon :core:test :app:assembleDebug
      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/MyMouse-${MYMOUSE_VERSION_NAME}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: MyMouse-*.apk

  windows:
    needs: meta
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Tests
        run: dotnet test
      - name: Publicar
        run: |
          $name = "${{ needs.meta.outputs.version }}"
          $common = @('-c','Release','-r','win-x64','--self-contained','true','-p:PublishSingleFile=true','-p:IncludeNativeLibrariesForSelfExtract=true',"-p:InformationalVersion=$name")
          dotnet publish src/MyMouse.Host @common -o out/MyMouse
          dotnet publish src/MyMouse.TestClient @common -o out/MyMouse
          Get-ChildItem out/MyMouse -Filter *.pdb | Remove-Item
          Compress-Archive -Path out/MyMouse/* -DestinationPath "$env:GITHUB_WORKSPACE/MyMouse-Windows-$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: MyMouse-Windows-*.zip

  release:
    if: needs.meta.outputs.tag != ''
    needs: [meta, android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Crear release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --prerelease --title "$TAG" --notes-file "docs/releases/$TAG.md"
